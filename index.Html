<!DOCTYPE html>
<html>
<head>
  <title>Indian Bazar</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f1f3f6;
      text-align: center;
    }
    h1 {
      background-color: #2874f0;
      color: white;
      padding: 15px;
    }
    select, button {
      padding: 10px;
      margin: 10px;
      width: 200px;
    }
    button {
      background-color: #fb641b;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Indian Bazar 🛒</h1>

<h3>Select State</h3>
<select id="state">
  <option>Bihar</option>
  <option>Uttar Pradesh</option>
</select>

<h3>Select District</h3>
<select id="district">
  <option>Saran</option>
  <option>Chapra</option>
</select>

<h3>Select City</h3>
<select id="city">
  <option>Dighwara</option>
  <option>Khanpur</option>
</select>

<h3>Select User Type</h3>
<select id="usertype">
  <option value="seller">Seller</option>
  <option value="customer">Customer</option>
</select>

<br>

<button onclick="goNext()">Continue</button>

<script>
function goNext() {
  var type = document.getElementById("usertype").value;
  if(type=="seller") {
    window.location.href = "seller.html";
  } else {
    window.location.href = "customer.html";
  }
}
</script>

</body>
</html>
